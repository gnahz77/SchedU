<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
    role="img" aria-label="SchedU icon (refined)">
    <defs>
        <!-- 背景渐变 - 使用 Mars Green 主题色 -->
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#006060" />
            <stop offset="1" stop-color="#008C8C" />
        </linearGradient>

        <!-- U 的投影 -->
        <filter id="uShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000"
                flood-opacity="0.22" />
        </filter>

        <!-- 轻微模糊用于日历背景的柔化（可选） -->
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="0.4" />
        </filter>
    </defs>

    <!-- 背景圆角方块（渐变） -->
    <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#bgGrad)" />

    <!-- 主体：居中大日历 -->
    <g transform="translate(110,168)">
        <!-- 日历整体背景 -->
        <rect x="0" y="0" width="800" height="700" rx="38" fill="#FFFFFF" opacity="0.12"
            filter="url(#soft)" />
        <!-- 日历头栏 -->
        <rect x="0" y="0" width="800" height="140" rx="38" fill="#FFFFFF" opacity="0.18" />

        <!-- 网格：3 列 × 2 行 -->
        <!-- 第一行 Y=170 -->
        <rect x="40" y="170" rx="22" width="225" height="205" fill="#FFFFFF" opacity="0.92" />
        <rect x="288" y="170" rx="22" width="225" height="205" fill="#FFFFFF" opacity="0.92" />
        <rect x="536" y="170" rx="22" width="225" height="205" fill="#FFFFFF" opacity="0.92" />
        <!-- 第二行 Y=405 -->
        <rect x="40" y="405" rx="22" width="225" height="205" fill="#FFFFFF" opacity="0.92" />
        <!-- 高亮格 -->
        <rect x="288" y="405" rx="22" width="225" height="205" fill="#4FBCBC" />
        <rect x="536" y="405" rx="22" width="225" height="205" fill="#FFFFFF" opacity="0.92" />
    </g>

    <!-- U 形（左上角装饰，重叠到日历上） — 品牌标识 -->
    <g transform="translate(120,160)">
<!--        <circle cx="70" cy="70" r="85" fill="#FFFFFF" opacity="0.20" />-->
        <path d="M35 40 L35 80 A35 35 0 0 0 105 80 L105 40" fill="none" stroke="#FFFFFF"
            stroke-width="20" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#uShadow)" />
    </g>

</svg>
